version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: tabletop-tournaments-sql
    ports:
      - "1433:1433"
    env_file:
      - .env
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data: